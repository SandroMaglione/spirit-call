<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0d1117" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <title>Top-down Team Shooter</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0d1117; overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      [hidden] { display: none !important; }
      /* What a failure leaves (see src/ui/crash.ts): over everything, styled here so it shows whatever failed. */
      .crash { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); background: rgba(8, 10, 18, 0.92); color: #eef1ff; font: 15px/1.45 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; -webkit-user-select: text; user-select: text; }
      .crash__box { width: min(440px, 100%); max-height: 100%; overflow: auto; display: grid; gap: 14px; justify-items: center; text-align: center; }
      .crash h1 { margin: 0; font: 800 italic 28px/1.1 "Barlow Condensed", "Avenir Next Condensed", sans-serif; letter-spacing: 0.03em; }
      .crash p { margin: 0; color: #c9cfe6; }
      .crash__action { min-width: 180px; height: 44px; padding: 0 24px; border: 0; border-radius: 22px; background: #ece5d8; color: #3b4255; font: 800 17px system-ui, sans-serif; cursor: pointer; box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3); }
      .crash__action:disabled { opacity: 0.6; }
      .crash details { width: 100%; text-align: left; color: #8d94b5; font-size: 12px; }
      .crash summary { cursor: pointer; text-align: center; }
      .crash pre { margin: 8px 0 0; max-height: 140px; overflow: auto; white-space: pre-wrap; word-break: break-word; font: 11px/1.4 ui-monospace, monospace; color: #ff8d98; }
      /* On-screen touch controls, positioned by SyncTouchPad: an icon each, as Genshin's. Cooldowns sweep round each button (`--cd`, 0..1 left); the ultimate's fills from below with energy. */
      .pad { position: absolute; inset: 0; pointer-events: none; }
      .pad > * { position: absolute; left: 0; top: 0; box-sizing: border-box; border-radius: 50%; }
      .pad__stick { border: 2px solid rgba(255, 255, 255, 0.25); background: radial-gradient(circle, rgba(255, 255, 255, 0.05), rgba(0, 0, 0, 0.18)); opacity: 0.6; transition: opacity 120ms; }
      .pad__stick.is-active { opacity: 1; border-color: rgba(255, 255, 255, 0.45); }
      .pad__knob { position: absolute; left: 0; top: 0; border-radius: 50%; background: rgba(255, 255, 255, 0.4); box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.45); }
      .pad__button { display: grid; place-content: center; overflow: hidden; border: 0; background: radial-gradient(closest-side, rgba(8, 10, 20, 0.03) 40%, rgba(8, 10, 20, 0.24) 100%); color: rgba(255, 255, 255, 0.92); font: 800 italic 13px "Barlow Condensed", "Avenir Next Condensed", sans-serif; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6); }
      .pad__button span { position: absolute; inset: 0; display: grid; place-items: center; }
      .pad__button svg { width: 56%; height: 56%; filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.55)); }
      .pad__button i { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(rgba(8, 10, 20, 0.55) calc(var(--cd, 0) * 1turn), transparent 0); }
      .pad__button em { position: absolute; inset: 0; display: grid; place-items: center; font: 800 16px "Barlow Condensed", sans-serif; font-style: normal; }
      .pad__button em:empty { display: none; }
      .pad__button:has(em:not(:empty)) span { opacity: 0; }
      .pad__button--attack { background: radial-gradient(closest-side, rgba(8, 10, 20, 0.04) 40%, rgba(8, 10, 20, 0.28) 100%); }
      .pad__button--attack svg { width: 58%; height: 58%; }
      /* The special as the others; its icon in her element while ready. */
      .pad__button--special.is-ready { color: color-mix(in srgb, var(--el) 45%, white); }
      .pad__button--ultimate { background: radial-gradient(closest-side, rgba(8, 10, 20, 0.05) 40%, rgba(8, 10, 20, 0.28) 100%); box-shadow: 0 0 10px 1px color-mix(in srgb, var(--el) 35%, transparent); }
      .pad__button--ultimate i { background: linear-gradient(0deg, color-mix(in srgb, var(--el) 60%, transparent) calc((1 - var(--cd, 0)) * 100%), transparent 0); }
      .pad__button--ultimate.is-ready { color: #fff; background: radial-gradient(circle at 40% 30%, color-mix(in srgb, var(--el) 70%, white), var(--el-deep) 85%); box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.85), 0 0 14px 2px color-mix(in srgb, var(--el) 85%, transparent); }
      .pad__button.is-held { background-color: rgba(255, 255, 255, 0.18); }
      .pad__aim { border: 2px solid #fff; background: rgba(255, 255, 255, 0.3); }
      /* The dev monitor toggle would sit under the left thumb on touch screens. */
      @media (pointer: coarse) { .btm-toggle { display: none; } }
      /* Phones in portrait: ask to rotate. */
      .rotate { display: none; }
      @media (orientation: portrait) and (pointer: coarse) {
        .rotate { position: fixed; inset: 0; z-index: 100; display: grid; place-content: center; gap: 8px; text-align: center; background: #0d1117; color: #e6edf3; font: 16px "IBM Plex Mono", ui-monospace, monospace; }
      }
      #game { position: fixed; inset: 0; }
      #game canvas { display: block; cursor: none; }
      .hud {
        position: absolute; inset: 0; pointer-events: none;
        font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; color: #eef1ff;
        /* A dark halo, so text stays readable over light floors as well as dark ones. */
        text-shadow: 0 0 3px #0d1117, 0 1px 2px #0d1117;
        /* Accents in the element of the character on the field (or of each member, on her tab). */
        --el: #9aa2c8; --el-deep: #2c3358;
      }
      [data-element="wind"] { --el: #5be0b0; --el-deep: #1f6f5c; }
      [data-element="fire"] { --el: #ff6a3d; --el-deep: #8a3220; }
      [data-element="water"] { --el: #3fb4ff; --el-deep: #1d4f8c; }
      [data-element="thunder"] { --el: #b38cff; --el-deep: #4d3591; }
      /* What is being played, top center: its name, a mark per wave, and what is left. */
      .hud__quest { position: absolute; top: max(10px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); display: grid; justify-items: center; gap: 4px; text-shadow: 0 1px 3px #000; white-space: nowrap; }
      .hud__quest-name { font: 800 italic 14px/1 "Barlow Condensed", sans-serif; letter-spacing: 0.04em; text-transform: uppercase; }
      .hud__waves { display: flex; gap: 2px; }
      .hud__waves:empty { display: none; }
      .hud__waves i { width: 13px; height: 4px; border-radius: 1px; background: rgba(0, 0, 0, 0.45); transform: skewX(-20deg); }
      .hud__waves i.is-done { background: #ffcf5a; }
      .hud__waves i.is-current { background: rgba(255, 207, 90, 0.5); box-shadow: 0 0 6px rgba(255, 207, 90, 0.6); }
      .hud__quest-progress { font: 700 10px/1 system-ui, sans-serif; opacity: 0.85; }
      .hud__quest-progress:empty { display: none; }
      /* The Extras' damage readout, one line: the damage a second, and the hits a second. */
      .hud__meter { display: flex; gap: 10px; align-items: baseline; font: 800 italic 14px/1 "Barlow Condensed", sans-serif; }
      .hud__meter b { color: #ffe08a; }
      .hud__meter span { color: #eef1ff; }
      /* The in-game menu's button, top left: two bars, as a pause sign. */
      .hud__menu { position: absolute; top: max(10px, env(safe-area-inset-top)); left: max(14px, env(safe-area-inset-left)); pointer-events: auto; display: flex; align-items: center; justify-content: center; gap: 5px; width: 42px; height: 42px; padding: 0; background: rgba(10, 12, 28, 0.6); border: 1px solid rgba(255, 255, 255, 0.22); border-radius: 50%; cursor: pointer; }
      .hud__menu i { display: block; width: 4px; height: 15px; border-radius: 1px; background: #eef1ff; box-shadow: 0 1px 2px #000; }
      .hud__menu:hover { border-color: rgba(255, 255, 255, 0.5); }
      /* The character on the field, bottom center (above the skill bar on a keyboard): a thin health bar, her health written on it, her state over it. */
      .hud__vitals { position: absolute; bottom: 116px; left: 50%; transform: translateX(-50%); display: grid; justify-items: center; gap: 3px; width: 220px; text-shadow: 0 1px 3px #000; }
      .hud[data-device="touch"] .hud__vitals { bottom: max(26px, env(safe-area-inset-bottom)); width: 140px; }
      .hud__health { position: relative; width: 100%; height: 8px; background: rgba(0, 0, 0, 0.45); border-radius: 4px; overflow: hidden; }
      .hud__health-fill { position: absolute; inset: 0; width: 100%; border-radius: 4px; background: linear-gradient(180deg, #c6ff9a, #7fd957); transition: width 120ms ease-out; }
      .hud__health-text { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font: 700 7px/1 system-ui, sans-serif; letter-spacing: 0.04em; text-shadow: 0 0 2px rgba(0, 0, 0, 0.55); }
      .hud[data-device="desktop"] .hud__health { height: 10px; border-radius: 5px; }
      .hud[data-device="desktop"] .hud__health-text { font-size: 8px; }
      /* Her state, as Genshin's: its icon in a small disc over the left end of her health bar, the time left a ring inside it (`--left`, 0..1). */
      .hud__state { position: absolute; left: 0; bottom: calc(100% + 3px); display: grid; place-items: center; width: 17px; height: 17px; border-radius: 50%; color: #fff; background: conic-gradient(color-mix(in srgb, var(--state) 55%, transparent) calc(var(--left, 1) * 1turn), rgba(10, 12, 28, 0.4) 0); box-shadow: 0 0 0 1px color-mix(in srgb, var(--state) 70%, transparent); }
      .hud__state svg { width: 11px; height: 11px; }
      .hud__state[hidden] { display: none; }
      .hud__state--burning { --state: #ff7b2e; }
      .hud__state--soaked { --state: #4aa8ff; }
      .hud__state--charged { --state: #b48cff; }
      .hud__state--swept { --state: #c9fff1; }
      .hud__state--cracked { --state: #e5ad58; }
      /* The fading layers each get a layer of their own (will-change): changing their opacity every frame only recomposites them, never repaints. */
      .hud__vignette { position: absolute; inset: 0; opacity: 0; box-shadow: inset 0 0 160px 40px rgba(255, 40, 40, 0.9); will-change: opacity; }
      /* Slow motion after a perfect dodge: the edges glow cold and the world dims around her. */
      .hud__focus { position: absolute; inset: 0; opacity: 0; pointer-events: none; box-shadow: inset 0 0 240px 80px rgba(120, 255, 240, 0.6); background: radial-gradient(ellipse at center, transparent 40%, rgba(8, 28, 44, 0.45) 100%); will-change: opacity; }
      /* An ultimate's moment: the world dims around her, the edges glow in her element's color, and its lines turn in toward her, closing in as it builds.
         It builds by its parts' opacity and scale only (see `ShowUltimateMoments`), so nothing repaints: the glow it starts with gives way to its glow at full strength, and the lines (their mask as it is at full strength) shrink to it. */
      .hud__moment { position: absolute; inset: 0; opacity: 0; pointer-events: none; --el: #ffd166; background: radial-gradient(ellipse at 50% 52%, transparent 14%, rgba(4, 6, 16, 0.78) 68%); will-change: opacity; }
      .hud__moment-glow { position: absolute; inset: 0; will-change: opacity; }
      .hud__moment-glow--start { box-shadow: inset 0 0 60px 4px color-mix(in srgb, var(--el) 50%, transparent); }
      .hud__moment-glow--full { box-shadow: inset 0 0 150px 22px color-mix(in srgb, var(--el) 50%, transparent); opacity: 0; }
      .hud__moment-lines { position: absolute; left: 50%; top: 52%; width: 180vmax; height: 180vmax; translate: -50% -50%; background: repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--el) 60%, transparent) 0 1.2deg, transparent 1.2deg 9deg); -webkit-mask: radial-gradient(closest-side, transparent 18%, #000 60%, transparent 92%); mask: radial-gradient(closest-side, transparent 18%, #000 60%, transparent 92%); opacity: 0.537; scale: 1.667; animation: moment-lines 1.2s linear infinite; will-change: opacity, scale, rotate; }
      @keyframes moment-lines { to { rotate: 40deg; } }
      /* A fall: for a moment the world darkens at its edges, glowing in her element's color as her light goes out (`--el`). */
      .hud__fall { position: absolute; inset: 0; opacity: 0; pointer-events: none; --el: #ffffff; background: radial-gradient(ellipse at 50% 52%, transparent 30%, rgba(8, 6, 18, 0.62) 100%); box-shadow: inset 0 0 220px 50px color-mix(in srgb, var(--el) 45%, transparent); will-change: opacity; }
      .hud__fall.is-on { animation: fall-dim 1s ease-in-out forwards; }
      @keyframes fall-dim { 0% { opacity: 0; } 20% { opacity: 1; } 75% { opacity: 1; } 100% { opacity: 0; } }
      .hud__banner { position: absolute; top: 22%; left: 50%; transform: translateX(-50%); font: 800 italic 48px "Barlow Condensed", sans-serif; letter-spacing: 0.08em; color: #fff; opacity: 0; text-shadow: 0 2px 12px #000; white-space: nowrap; }
      .hud__banner.is-showing { animation: banner 1.8s ease-out forwards; }
      @keyframes banner { 0% { opacity: 0; transform: translate(-50%, 10px); } 15% { opacity: 1; transform: translate(-50%, 0); } 70% { opacity: 1; } 100% { opacity: 0; } }
      .hud__skills { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; }
      .hud__skill { position: relative; width: 84px; padding: 7px 6px 6px; display: grid; justify-items: center; gap: 3px; background: rgba(16, 18, 36, 0.8); border: 2px solid rgba(255, 255, 255, 0.2); border-radius: 8px; overflow: hidden; font: 800 italic 13px "Barlow Condensed", sans-serif; text-transform: uppercase; color: #eef1ff; }
      .hud__skill kbd { font: 700 11px system-ui, sans-serif; color: var(--el); }
      .hud__skill.is-ready { border-color: var(--el); box-shadow: 0 0 10px color-mix(in srgb, var(--el) 45%, transparent); }
      .hud__skill--ultimate kbd { color: #ffcf5a; }
      .hud__skill--ultimate.is-ready { border-color: #ffcf5a; box-shadow: 0 0 14px rgba(255, 207, 90, 0.6); }
      .hud__skill i { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(8, 10, 20, 0.72); pointer-events: none; }
      /*
       * The team, as Genshin's party list: a row per member, a dark pill with her name and health, her slanted
       * portrait at its right end, in a column on the right; on touch, each portrait sits on its switch button.
       * The portrait's edge is her element's color; her ultimate's icon glows left of the row once it is ready;
       * a dark fill while the next switch waits (`--wait`, 0..1 left). The one on the field stands out.
       */
      .team { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); display: grid; gap: 10px; --slant: polygon(24% 0, 100% 0, 76% 100%, 0 100%); }
      .team.is-touch { inset: 0; transform: none; display: block; }
      .team.is-touch .team__member { position: absolute; }
      .team__member { display: flex; flex-direction: row-reverse; align-items: center; pointer-events: auto; cursor: pointer; transition: opacity 150ms; }
      .team__face { position: relative; z-index: 1; box-sizing: border-box; width: 52px; height: 52px; transition: transform 150ms; }
      .team__face::before { content: ""; position: absolute; inset: 0; clip-path: var(--slant); background: var(--el); }
      .team__portrait { position: absolute; inset: 2px; clip-path: var(--slant); background: center / cover no-repeat; background-color: var(--el-deep); }
      .team__wait { position: absolute; inset: 2px; clip-path: var(--slant); background: linear-gradient(0deg, rgba(0, 0, 0, 0.65) calc(var(--wait, 0) * 100%), transparent 0); display: none; }
      .team__member.is-waiting .team__wait { display: block; }
      .team__face kbd { position: absolute; left: -4px; bottom: -3px; padding: 0 4px; background: var(--el); clip-path: polygon(3px 0, 100% 0, calc(100% - 3px) 100%, 0 100%); font: 800 italic 12px/14px "Barlow Condensed", sans-serif; color: #0d1020; text-shadow: none; }
      .team__face i { position: absolute; right: 2px; bottom: -2px; width: 9px; height: 9px; border-radius: 50%; display: none; border: 1px solid #0d1117; }
      .team__face i.team__state--burning { display: block; background: #ff7b2e; }
      .team__face i.team__state--soaked { display: block; background: #4aa8ff; }
      .team__info { box-sizing: border-box; display: grid; justify-items: end; gap: 3px; width: 82px; margin-right: -6px; padding: 4px 12px 5px 12px; background: linear-gradient(90deg, rgba(10, 12, 28, 0), rgba(10, 12, 28, 0.36) 35%); border-radius: 999px 0 0 999px; font: 600 9.5px/1 "Barlow Condensed", sans-serif; letter-spacing: 0.05em; text-transform: uppercase; color: rgba(238, 241, 255, 0.85); text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7); }
      .team__info span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .team__hp { display: block; justify-self: end; width: 46px; height: 2px; background: rgba(255, 255, 255, 0.14); border-radius: 1px; overflow: hidden; }
      .team__hp i { display: block; height: 100%; background: rgba(159, 255, 122, 0.75); transition: width 120ms ease-out; }
      .team__burst { display: none; place-items: center; width: 32px; height: 32px; margin-right: 8px; border-radius: 50%; color: rgba(255, 255, 255, 0.9); background: radial-gradient(circle, color-mix(in srgb, var(--el) 55%, rgba(12, 14, 26, 0.6)), color-mix(in srgb, var(--el-deep) 55%, rgba(12, 14, 26, 0.35))); box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.3), 0 0 6px color-mix(in srgb, var(--el) 40%, transparent); }
      .team__burst svg { width: 18px; height: 18px; }
      .team__member.is-ready:not(.is-field) .team__burst { display: grid; }
      /* On the field: her row lit, the portrait a little forward. */
      .team__member.is-field .team__info { background: linear-gradient(90deg, rgba(10, 12, 28, 0), color-mix(in srgb, var(--el) 40%, rgba(10, 12, 28, 0.45)) 35%); }
      .team__member.is-field .team__face { transform: translateX(-4px) scale(1.06); }
      .team.is-touch .team__face kbd { display: none; }
      .team__member.is-fallen { opacity: 0.35; filter: grayscale(1); animation: member-falls 0.9s ease-out; }
      /* Her row as she falls: a red flash and a jolt before it goes gray. */
      @keyframes member-falls { 0% { opacity: 1; filter: grayscale(0) brightness(1.6) drop-shadow(0 0 8px #ff4a3a); transform: translateX(-6px); } 12% { transform: translateX(5px); } 24% { transform: translateX(-3px); } 40% { opacity: 1; filter: grayscale(0.4); transform: none; } }
      .hud__hint { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); font-size: 12px; color: #9aa2c8; white-space: nowrap; }
      .tuning { position: absolute; top: 12px; right: 12px; bottom: 12px; width: 320px; display: flex; flex-direction: column; background: rgba(13, 17, 23, 0.94); border: 1px solid #30363d; border-radius: 8px; color: #e6edf3; font: 12px "IBM Plex Mono", ui-monospace, monospace; z-index: 10; }
      .tuning[hidden] { display: none; }
      .tuning__header { display: grid; gap: 6px; padding: 10px 12px; border-bottom: 1px solid #30363d; }
      .tuning__hint { color: #7d8590; font-size: 11px; }
      .tuning__actions { display: flex; gap: 6px; }
      .tuning__actions button { font: inherit; color: inherit; background: #21262d; border: 1px solid #30363d; border-radius: 4px; padding: 3px 8px; cursor: pointer; }
      .tuning__body { overflow: auto; padding: 6px 12px 12px; }
      .tuning__spawn { display: grid; gap: 6px; padding: 8px 12px; border-bottom: 1px solid #30363d; }
      .tuning__spawn-buttons { display: flex; flex-wrap: wrap; gap: 4px; }
      .tuning__spawn button { font: inherit; color: inherit; background: #21262d; border: 1px solid #30363d; border-radius: 4px; padding: 2px 6px; cursor: pointer; }
      .tuning__spawn button.is-clear { color: #ff7b72; }
      .tuning__group { margin: 4px 0; }
      .tuning__group summary { cursor: pointer; color: #4ecdc4; padding: 3px 0; }
      .tuning__group .tuning__group { margin-left: 10px; }
      .tuning__row { display: grid; grid-template-columns: 1fr 96px; align-items: center; gap: 8px; padding: 2px 0 2px 10px; }
      .tuning__row.is-changed span { color: #f7c948; }
      .tuning__row input[type="number"] { width: 96px; font: inherit; color: inherit; background: #0d1117; border: 1px solid #30363d; border-radius: 3px; padding: 2px 4px; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div class="rotate"><div style="font-size: 40px">⟳</div><div>Rotate your phone to landscape</div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
