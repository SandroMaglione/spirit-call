<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0d1117" />
    <title>Top-down Team Shooter</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0d1117; overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      [hidden] { display: none !important; }
      /* On-screen touch controls, positioned by SyncTouchPad. */
      .pad { position: absolute; inset: 0; pointer-events: none; }
      .pad > * { position: absolute; left: 0; top: 0; box-sizing: border-box; border-radius: 50%; }
      .pad__stick { border: 2px solid rgba(230, 237, 243, 0.18); background: rgba(13, 17, 23, 0.25); opacity: 0.55; transition: opacity 120ms; }
      .pad__stick.is-active { opacity: 1; border-color: rgba(78, 205, 196, 0.6); }
      .pad__knob { position: absolute; left: 0; top: 0; border-radius: 50%; background: rgba(78, 205, 196, 0.55); box-shadow: 0 0 12px rgba(78, 205, 196, 0.5); }
      .pad__button { display: grid; place-content: center; overflow: hidden; border: 2px solid #30363d; background: rgba(13, 17, 23, 0.6); color: #e6edf3; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; }
      .pad__button span { position: relative; }
      .pad__button i { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(8, 10, 14, 0.75); }
      .pad__button.is-ready { border-color: #4ecdc4; box-shadow: 0 0 10px rgba(78, 205, 196, 0.35); }
      .pad__button--attack { font-size: 13px; border-color: #f7c948; }
      .pad__button--ultimate.is-ready { border-color: #ffd166; box-shadow: 0 0 14px rgba(255, 209, 102, 0.6); }
      .pad__button.is-held { background: rgba(78, 205, 196, 0.25); transform-origin: center; }
      .pad__aim { border: 2px solid #e6edf3; background: rgba(230, 237, 243, 0.3); }
      /* The dev monitor toggle would sit under the left thumb on touch screens. */
      @media (pointer: coarse) { .btm-toggle { display: none; } }
      /* Phones in portrait: ask to rotate. */
      .rotate { display: none; }
      @media (orientation: portrait) and (pointer: coarse) {
        .rotate { position: fixed; inset: 0; z-index: 100; display: grid; place-content: center; gap: 8px; text-align: center; background: #0d1117; color: #e6edf3; font: 16px "IBM Plex Mono", ui-monospace, monospace; }
      }
      #game { position: fixed; inset: 0; }
      #game canvas { display: block; cursor: none; }
      .hud {
        position: absolute; inset: 0; pointer-events: none;
        font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; color: #e6edf3;
      }
      .hud__panel { position: absolute; top: 16px; left: 16px; display: grid; gap: 6px; }
      .hud__dash { font-size: 14px; letter-spacing: 0.08em; color: #4ecdc4; }
      .hud__combat { font-size: 13px; color: #f7c948; }
      .hud__wave { font-size: 13px; color: #e6edf3; }
      .hud__health { position: relative; width: 240px; height: 18px; background: rgba(13, 17, 23, 0.8); border: 1px solid #30363d; border-radius: 4px; overflow: hidden; }
      .hud__health-fill { position: absolute; inset: 0; width: 100%; background: linear-gradient(90deg, #ff3b3b, #ff7a6b); transition: width 120ms ease-out; }
      .hud__health span { position: relative; display: block; text-align: center; font-size: 12px; line-height: 18px; color: #fff; text-shadow: 0 1px 2px #000; }
      .hud__vignette { position: absolute; inset: 0; opacity: 0; box-shadow: inset 0 0 160px 40px rgba(255, 40, 40, 0.9); }
      .hud__banner { position: absolute; top: 22%; left: 50%; transform: translateX(-50%); font-size: 44px; font-weight: 700; letter-spacing: 0.2em; color: #e6edf3; opacity: 0; text-shadow: 0 2px 12px #000; }
      .hud__banner.is-showing { animation: banner 1.8s ease-out forwards; }
      @keyframes banner { 0% { opacity: 0; transform: translate(-50%, 10px); } 15% { opacity: 1; transform: translate(-50%, 0); } 70% { opacity: 1; } 100% { opacity: 0; } }
      .hud__skills { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; }
      .hud__skill { position: relative; width: 78px; padding: 8px 6px 6px; display: grid; justify-items: center; gap: 4px; background: rgba(13, 17, 23, 0.82); border: 1px solid #30363d; border-radius: 6px; overflow: hidden; font-size: 11px; color: #e6edf3; }
      .hud__skill kbd { font: 700 14px inherit; color: #4ecdc4; }
      .hud__skill.is-ready { border-color: #4ecdc4; box-shadow: 0 0 10px rgba(78, 205, 196, 0.35); }
      .hud__skill--ultimate kbd { color: #ffd166; }
      .hud__skill--ultimate.is-ready { border-color: #ffd166; box-shadow: 0 0 14px rgba(255, 209, 102, 0.6); }
      .hud__skill i { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(8, 10, 14, 0.72); pointer-events: none; }
      .hud__gameover { position: absolute; inset: 0; display: grid; place-content: center; gap: 12px; text-align: center; background: rgba(8, 10, 14, 0.62); }
      .hud__gameover[hidden] { display: none; }
      .hud__gameover-title { font-size: 56px; font-weight: 700; letter-spacing: 0.25em; color: #ff5d6c; }
      .hud__gameover.is-cleared .hud__gameover-title { color: #7ee08a; }
      .hud__gameover-stats { font-size: 16px; color: #e6edf3; }
      .hud__gameover-hint { font-size: 13px; color: #7d8590; }
      .hud__stats { font-size: 12px; color: #7d8590; }
      .hud__mute { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); pointer-events: auto; font-size: 18px; line-height: 1; padding: 6px 8px; background: rgba(13, 17, 23, 0.6); border: 1px solid #30363d; border-radius: 6px; cursor: pointer; }
      .hud__hint { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); font-size: 12px; color: #7d8590; }
      .tuning { position: absolute; top: 12px; right: 12px; bottom: 12px; width: 320px; display: flex; flex-direction: column; background: rgba(13, 17, 23, 0.94); border: 1px solid #30363d; border-radius: 8px; color: #e6edf3; font: 12px "IBM Plex Mono", ui-monospace, monospace; z-index: 10; }
      .tuning[hidden] { display: none; }
      .tuning__header { display: grid; gap: 6px; padding: 10px 12px; border-bottom: 1px solid #30363d; }
      .tuning__hint { color: #7d8590; font-size: 11px; }
      .tuning__actions { display: flex; gap: 6px; }
      .tuning__actions button { font: inherit; color: inherit; background: #21262d; border: 1px solid #30363d; border-radius: 4px; padding: 3px 8px; cursor: pointer; }
      .tuning__body { overflow: auto; padding: 6px 12px 12px; }
      .tuning__spawn { display: grid; gap: 6px; padding: 8px 12px; border-bottom: 1px solid #30363d; }
      .tuning__spawn-buttons { display: flex; flex-wrap: wrap; gap: 4px; }
      .tuning__spawn button { font: inherit; color: inherit; background: #21262d; border: 1px solid #30363d; border-radius: 4px; padding: 2px 6px; cursor: pointer; }
      .tuning__spawn button.is-clear { color: #ff7b72; }
      .tuning__group { margin: 4px 0; }
      .tuning__group summary { cursor: pointer; color: #4ecdc4; padding: 3px 0; }
      .tuning__group .tuning__group { margin-left: 10px; }
      .tuning__row { display: grid; grid-template-columns: 1fr 96px; align-items: center; gap: 8px; padding: 2px 0 2px 10px; }
      .tuning__row.is-changed span { color: #f7c948; }
      .tuning__row input[type="number"] { width: 96px; font: inherit; color: inherit; background: #0d1117; border: 1px solid #30363d; border-radius: 3px; padding: 2px 4px; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div class="rotate"><div style="font-size: 40px">⟳</div><div>Rotate your phone to landscape</div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
