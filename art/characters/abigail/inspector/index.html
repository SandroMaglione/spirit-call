<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Abigail inspector</title>
  <style>
    html, body { margin: 0; height: 100%; background: #c9c1ad; font: 13px system-ui, sans-serif; color: #2b2a28; overflow: hidden }
    canvas { display: block }
    .labels { position: absolute; inset: 0; pointer-events: none }
    .labels span { position: absolute; transform: translateX(-50%); white-space: nowrap; font-weight: 600 }
    .title { position: absolute; left: 12px; top: 10px; font-weight: 700 }
  </style>
</head>
<body>
  <div class="title" id="title"></div>
  <div class="labels" id="labels"></div>
  <script type="module" src="./inspector.mjs"></script>
</body>
</html>
