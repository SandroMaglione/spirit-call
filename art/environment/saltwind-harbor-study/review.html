<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Harbor model study</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #15232d; color: #e6e9df; font: 15px system-ui, sans-serif; }
    header { padding: 20px 28px 15px; border-bottom: 1px solid #394b54; }
    h1 { margin: 0 0 5px; font-size: 26px; letter-spacing: -.6px; }
    p { margin: 0; color: #afc0c4; line-height: 1.5; }
    nav { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 14px; }
    button { cursor: pointer; border: 1px solid #526872; background: #233640; color: #dae3de; border-radius: 6px; padding: 8px 14px; font: inherit; }
    button[aria-pressed="true"] { color: #18242a; background: #c4b28d; border-color: #c4b28d; }
    #stage { position: relative; }
    canvas { display: block; width: 100%; touch-action: none; }
    #labels { position: absolute; inset: 0; pointer-events: none; }
    .label { position: absolute; padding: 9px 15px; background: linear-gradient(transparent, #15232dcd); }
    .label b { display: block; font-weight: 600; font-size: 17px; margin-bottom: 2px; }
    .label span { color: #c0cfce; font-size: 13px; }
    #status { padding: 10px 28px 16px; font-size: 12px; color: #9eb4b7; }
    @media(max-width:600px) { header { padding: 14px 16px 12px; } h1 {font-size:22px} button {padding:7px 10px; font-size:13px} .label b {font-size:14px} .label span{font-size:11px} }
  </style>
</head>
<body>
  <header>
    <h1>Harbor model study</h1>
    <p id="description">Loading models…</p>
    <nav aria-label="Review views">
      <button data-view="small">Small details</button>
      <button data-view="working">Working props</button>
      <button data-view="large">Large assemblies</button>
      <button data-view="compare">Before and after</button>
      <button data-view="outside">Outside the grid</button>
    </nav>
  </header>
  <main id="stage"><canvas id="canvas"></canvas><div id="labels"></div></main>
  <div id="status">Actual GLB models · blue spirit at the current game scale · drag or touch the view to rotate</div>
  <script type="module" src="./review.js"></script>
</body>
</html>
