# Checks and deploys the game to Cloudflare (deploy/alchemy.run.ts). Every
# pull request deploys a `pr-<n>` preview, a playtest build with a database
# of its own for its runs (its address is commented on the PR), and closing
# the PR destroys both. From main, only by hand (Actions, "Deploy", run from
# main, picking the stage): `prod`, the release, sending nothing, or
# `playtest`, the testers' game, sending their runs. The game changes only
# when its developer decides (see docs/playtest.md, "Releasing"); those runs
# also apply the playtest database's new migrations
# (deploy/stacks/database.ts) first. `pnpm check`
# also builds a release build and fails if it carries any playtest code.
# Builds use the published bevy-ts release in package.json `bevyTsRelease`.
# The Cloudflare secrets come from deploy/stacks/github.ts.
name: Deploy

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:
    inputs:
      stage:
        description: "What to deploy from main: the release (prod, sends nothing) or the testers' game (playtest, sends runs)"
        type: choice
        options: [playtest, prod]
        default: playtest

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  STAGE: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || inputs.stage }}

jobs:
  deploy:
    # Started by hand, it only deploys from main (prod or the testers' game)
    if: github.event.action != 'closed' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Use the published bevy-ts
        run: node scripts/use-published-bevy-ts.ts
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Check
        run: pnpm check
      - name: Balance regression audit
        timeout-minutes: 15
        run: pnpm balance --compare test/balance-baseline.json --output balance-report.json
      - name: Upload balance measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balance-${{ github.run_id }}
          path: balance-report.json
          if-no-files-found: ignore
      - name: Install deploy tooling
        run: pnpm --dir deploy install --frozen-lockfile
      - name: Check deploy tooling
        run: pnpm --dir deploy typecheck
      - name: Deploy the database
        # Only main changes the playtest database (its migrations only ever
        # add; see deploy/stacks/database.ts)
        if: github.ref == 'refs/heads/main'
        working-directory: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm alchemy deploy --config stacks/database.ts --stage shared --yes --no-input
      - name: Deploy
        working-directory: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.number }}
        run: |
          # Alchemy reads the pull request number from PULL_REQUEST, and an
          # empty value is not a number, so it is only set on pull requests
          if [ -n "$PR" ]; then export PULL_REQUEST="$PR"; fi
          pnpm alchemy provider check-env --provider Cloudflare --provider GitHub
          pnpm alchemy deploy --stage "$STAGE" --yes --no-input

  cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Use the published bevy-ts
        run: node scripts/use-published-bevy-ts.ts
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Install deploy tooling
        run: pnpm --dir deploy install --frozen-lockfile
      - name: Destroy the preview
        working-directory: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm alchemy destroy --stage "$STAGE" --yes --no-input
