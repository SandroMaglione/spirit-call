# Moves to a newer bevy-ts release, by hand only (the game is a finished
# release: it keeps the version in package.json `bevyTsRelease` until its
# developer decides): when npm has a newer version, checks the game against
# it, commits the bump to main, and deploys prod. A release that breaks the
# game fails this run and changes nothing.
name: Follow bevy-ts

on:
  workflow_dispatch:

concurrency:
  group: bevy-ts
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Find a newer release
        id: release
        run: |
          current=$(node -p 'require("./package.json").bevyTsRelease')
          latest=$(npm view @typeonce/bevy-ts version)
          echo "current $current, latest $latest"
          if [ "$current" != "$latest" ]; then echo "version=$latest" >> "$GITHUB_OUTPUT"; fi
      - if: steps.release.outputs.version
        uses: pnpm/action-setup@v4
      - if: steps.release.outputs.version
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Commit the bump
        if: steps.release.outputs.version
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          npm pkg set bevyTsRelease="$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "bevy-ts $VERSION for releases" -m "Published on npm; the game passes its checks against it."
      - name: Check the game against it
        if: steps.release.outputs.version
        run: |
          node scripts/use-published-bevy-ts.ts
          pnpm install --no-frozen-lockfile
          pnpm check
          # The swap only applies to this check: the repository keeps the links
          git checkout -- package.json pnpm-lock.yaml
      - name: Push and deploy
        if: steps.release.outputs.version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push origin HEAD:main
          # Pushes made with this workflow's token start no workflows, so the
          # deploy is started explicitly
          gh workflow run deploy.yml --ref main
