# Builds the phone apps (Capacitor, see docs/mobile.md) on every pull request
# and by hand, to show both native projects still build: an Android debug APK
# (kept as the run's artifact, installable on a phone), the Android store
# build (a release bundle, kept when signed with the upload key from the
# repository's secrets: the file to upload to Google Play), which is also
# installed on an emulator to show it starts, and an iOS build for the
# simulator (unsigned). All wrap the release build of the game, which sends
# nothing.
name: Apps

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Use the published bevy-ts
        run: node scripts/use-published-bevy-ts.ts
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Build the game into the app
        run: pnpm exec vite build && pnpm exec cap sync android
      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: spirit-call-android-${{ github.run_id }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Get the upload key
        # The upload key from the secrets (see docs/mobile.md, "Releasing on Google
        # Play"); without them, a throwaway key, so the store build is still built
        # and tried on the emulator, but not kept.
        env:
          KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          key="$RUNNER_TEMP/upload.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$key"
            echo "UPLOAD_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "UPLOAD_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "UPLOAD_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "UPLOAD_SIGNED=true" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -keystore "$key" -storepass throwaway -keypass throwaway -alias throwaway \
              -keyalg RSA -keysize 2048 -validity 1 -dname "CN=Throwaway" -noprompt
            echo "UPLOAD_KEYSTORE_PASSWORD=throwaway" >> "$GITHUB_ENV"
            echo "UPLOAD_KEY_ALIAS=throwaway" >> "$GITHUB_ENV"
            echo "UPLOAD_KEY_PASSWORD=throwaway" >> "$GITHUB_ENV"
            echo "UPLOAD_SIGNED=false" >> "$GITHUB_ENV"
          fi
          echo "UPLOAD_KEYSTORE=$key" >> "$GITHUB_ENV"
      - name: Build the store bundle and APK
        working-directory: android
        env:
          # Every build has a higher version code than the last, as Google Play requires.
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew bundleRelease assembleRelease --no-daemon
      - name: Keep the store bundle
        if: env.UPLOAD_SIGNED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: spirit-call-play-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Pass the store APK to the emulator
        uses: actions/upload-artifact@v4
        with:
          name: spirit-call-release-apk-${{ github.run_id }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 1

  android-starts:
    # The store build (no internet permission) installed on an emulator: it must
    # open on the list of accounts.
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: spirit-call-release-apk-${{ github.run_id }}
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install app-release.apk
            adb shell am start -n com.sandromaglione.spiritcall/.MainActivity
            for i in $(seq 1 30); do sleep 5; adb shell uiautomator dump /sdcard/ui.xml > /dev/null 2>&1; adb shell cat /sdcard/ui.xml > ui.xml; if grep -q "Name your account" ui.xml; then echo "The app opened on the list of accounts"; exit 0; fi; done; echo "The app did not show the list of accounts"; adb exec-out screencap -p > screen.png; adb logcat -d | grep -iE "capacitor|chromium|AndroidRuntime" | tail -100; cat ui.xml; exit 1

  ios:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Use the newest Xcode on the runner
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | grep -iv beta | sort -V | tail -1)" && xcodebuild -version
      - name: Use the published bevy-ts
        run: node scripts/use-published-bevy-ts.ts
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Build the game into the app
        run: pnpm exec vite build && pnpm exec cap sync ios
      - name: Build for the simulator
        run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
