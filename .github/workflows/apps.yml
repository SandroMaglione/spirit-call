# Builds the phone apps (Capacitor, see docs/mobile.md) on every pull request
# and by hand, to show both native projects still build: an Android debug APK
# (kept as the run's artifact, installable on a phone) and an iOS build for
# the simulator (unsigned: signing and the stores come later). Both wrap the
# release build of the game, which sends nothing.
name: Apps

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Use the published bevy-ts
        run: node scripts/use-published-bevy-ts.ts
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Build the game into the app
        run: pnpm exec vite build && pnpm exec cap sync android
      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: spirit-call-android-${{ github.run_id }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Use the newest Xcode on the runner
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | grep -iv beta | sort -V | tail -1)" && xcodebuild -version
      - name: Use the published bevy-ts
        run: node scripts/use-published-bevy-ts.ts
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Build the game into the app
        run: pnpm exec vite build && pnpm exec cap sync ios
      - name: Build for the simulator
        run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
